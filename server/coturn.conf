# RemoteLink Internet MVP — coturn como RELAY CEGO com auth temporária.
# O TURN nunca tem acesso ao conteúdo: mídia é DTLS/SRTP fim-a-fim
# (chaves negociadas entre celular e browser). Segredo via ENV (TURN_SECRET),
# NUNCA commitado. Sem TURN sem auth: `stale-nonce` + secret obrigatório.
listening-port=3478
tls-listening-port=5349
realm=remotelink
server-name=remotelink
fingerprint
lt-cred-mech
use-auth-secret
# O segredo compartilhado entra via ENV (TURN_SECRET) na linha de comando
# do container (ver Dockerfile) — nunca commitado neste arquivo.
stale-nonce=600
# Credencial temporária (TURN REST): username `expiry:deviceId`,
# password = HMAC-SHA256(static-auth-secret, username), TTL 3600s.
# O backend de signaling gera e entrega via sessão autenticada.
max-allocate-lifetime=3600
max-default-lifetime=3600
no-cli
# MVP: relay TCP liberado (com auth + denied-peer-ip) para NATs restritivos;
# o relay continua cego (SRTP fim-a-fim, sem acesso ao conteúdo).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
userdb=/var/lib/turn/turndb
