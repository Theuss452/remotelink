name: Build RemoteLink Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      REMOTELINK_UPDATE_MANIFEST_URL: ${{ vars.REMOTELINK_UPDATE_MANIFEST_URL }}
      REMOTELINK_DIRECT_APK_URL: ${{ vars.REMOTELINK_DIRECT_APK_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Validate browser scripts
        run: |
          node --check app/src/main/assets/web/app.js
          node --check app/src/main/assets/web/stability.js
          node --check app/src/main/assets/web/strong-pair.js
          node --check app/src/main/assets/web/transfer.js
          node --check app/src/main/assets/web/reconnect.js
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Prepare Android SDK
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
      - name: Build direct debug APK
        run: |
          gradle --no-daemon --stacktrace assembleDirectDebug
          cp app/build/outputs/apk/direct/debug/app-direct-debug.apk RemoteLink-v0.9.3-alpha-direct-debug.apk
      - uses: actions/upload-artifact@v4
        with: {name: RemoteLink-v0.9.3-alpha-direct-debug, path: RemoteLink-v0.9.3-alpha-direct-debug.apk, retention-days: 14}
      - name: Check release signing configuration
        id: signing
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - name: Restore release keystore
        if: steps.signing.outputs.enabled == 'true'
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/remotelink-release.jks"
          chmod 600 "$RUNNER_TEMP/remotelink-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/remotelink-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK and Play AAB
        if: steps.signing.outputs.enabled == 'true'
        run: |
          gradle --no-daemon --stacktrace assembleDirectRelease bundlePlayRelease
          cp app/build/outputs/apk/direct/release/app-direct-release.apk RemoteLink-v0.9.3-alpha-release.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab RemoteLink-v0.9.3-alpha-play.aab
      - name: Verify release APK signature
        if: steps.signing.outputs.enabled == 'true'
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          [[ -x "$APKSIGNER" ]] || APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          [[ -n "$APKSIGNER" && -x "$APKSIGNER" ]] || { echo "apksigner não encontrado" >&2; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs RemoteLink-v0.9.3-alpha-release.apk
      - name: Generate update manifest
        if: steps.signing.outputs.enabled == 'true'
        run: |
          python3 - <<'PY'
          import json, os, hashlib
          name='RemoteLink-v0.9.3-alpha-release.apk'
          sha=hashlib.sha256(open(name,'rb').read()).hexdigest()
          data={
            'packageName':'app.remotelink',
            'versionCode':18,
            'versionName':'0.9.3-alpha',
            'apkUrl':os.environ.get('REMOTELINK_DIRECT_APK_URL','').strip(),
            'sha256':sha,
            'notes':'RemoteLink v0.9.3-alpha: geometria física rotacionada para captura completa, telemetria de atraso por intervalo e qualidade adaptativa para impedir filas de vídeo excessivas.'
          }
          open('updates.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Upload signed release bundle
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RemoteLink-v0.9.3-alpha-signed-release
          path: |
            RemoteLink-v0.9.3-alpha-release.apk
            RemoteLink-v0.9.3-alpha-play.aab
            updates.json
          retention-days: 30
