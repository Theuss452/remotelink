name: Build RemoteLink Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      REMOTELINK_UPDATE_MANIFEST_URL: ${{ vars.REMOTELINK_UPDATE_MANIFEST_URL }}
      REMOTELINK_DIRECT_APK_URL: ${{ vars.REMOTELINK_DIRECT_APK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate browser scripts
        shell: bash
        run: |
          node --check app/src/main/assets/web/app.js
          node --check app/src/main/assets/web/strong-pair.js
          node --check app/src/main/assets/web/transfer.js
          node --check app/src/main/assets/web/reconnect.js

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK
        shell: bash
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Build direct debug APK
        shell: bash
        run: |
          gradle --no-daemon --stacktrace assembleDirectDebug
          cp -f app/build/outputs/apk/direct/debug/app-direct-debug.apk RemoteLink-v0.8.1-alpha-direct-debug.apk

      - name: Upload direct debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RemoteLink-v0.8.1-alpha-direct-debug
          path: RemoteLink-v0.8.1-alpha-direct-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check release signing configuration
        id: signing
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signed release skipped: configure ANDROID_KEYSTORE_* repository secrets."
          fi

      - name: Restore release keystore
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/remotelink-release.jks"
          chmod 600 "$RUNNER_TEMP/remotelink-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/remotelink-release.jks" >> "$GITHUB_ENV"

      - name: Build signed direct release APK and Play AAB
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          gradle --no-daemon --stacktrace assembleDirectRelease bundlePlayRelease
          cp -f app/build/outputs/apk/direct/release/app-direct-release.apk RemoteLink-v0.8.1-alpha-release.apk
          cp -f app/build/outputs/bundle/playRelease/app-play-release.aab RemoteLink-v0.8.1-alpha-play.aab

      - name: Verify release APK signature
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          if [[ ! -x "$APKSIGNER" ]]; then
            APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          fi
          if [[ -z "$APKSIGNER" || ! -x "$APKSIGNER" ]]; then
            echo "apksigner não foi encontrado no Android SDK." >&2
            find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -type f -name 'apksigner*' -print || true
            exit 1
          fi
          echo "Usando apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs RemoteLink-v0.8.1-alpha-release.apk

      - name: Generate direct update manifest
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          sha = os.popen("sha256sum RemoteLink-v0.8.1-alpha-release.apk").read().split()[0]
          data = {
              "packageName": "app.remotelink",
              "versionCode": 13,
              "versionName": "0.8.1-alpha",
              "apkUrl": os.environ.get('REMOTELINK_DIRECT_APK_URL', '').strip(),
              "sha256": sha,
              "notes": "RemoteLink v0.8.1-alpha: QR visível, aprovação de arquivos, DataChannel allowlist e menor pressão de captura/encoder."
          }
          with open('updates.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
          cat updates.json

      - name: Upload signed release bundle
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RemoteLink-v0.8.1-alpha-signed-release
          path: |
            RemoteLink-v0.8.1-alpha-release.apk
            RemoteLink-v0.8.1-alpha-play.aab
            updates.json
          if-no-files-found: error
          retention-days: 30
