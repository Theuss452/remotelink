name: Build RemoteLink APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate browser scripts
        shell: bash
        run: |
          node --check app/src/main/assets/web/app.js
          node --check app/src/main/assets/web/reconnect.js

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        shell: bash
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          gradle --no-daemon --stacktrace assembleDebug
          cp -f app/build/outputs/apk/debug/app-debug.apk RemoteLink-v0.5-alpha-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RemoteLink-v0.5-alpha-debug
          path: RemoteLink-v0.5-alpha-debug.apk
          if-no-files-found: error
          retention-days: 14
